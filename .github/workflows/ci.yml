name: CI & Quality Gate

on:
  push:
    branches: [ main, backend ]
  pull_request:
    branches: [ main, backend ]

jobs:
  test-and-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax validation
        run: |
          node --check backend/server.js backend/app.js backend/dev.js

      - name: Security audit (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run unit & integration tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Publish Test Summary
        if: always()
        run: |
          echo "### 📊 Resumen de Ejecución de CI" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js**: v20" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: Ejecutados exitosamente con Jest" >> $GITHUB_STEP_SUMMARY
          echo "- **Cobertura**: Artefacto generado en carpeta \`coverage/\`" >> $GITHUB_STEP_SUMMARY
