name: API E2E Tests (Newman)

on:
  push:
    branches: [ main, backend ]
  pull_request:
    branches: [ main, backend ]

jobs:
  api-tests:
    name: Postman E2E Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start backend server
        run: |
          NODE_ENV=development SEED_ON_START=true npm start &
        env:
          PORT: 3000

      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/categorias > /dev/null; then
              echo "✅ Servidor levantado y respondiendo en http://localhost:3000"
              exit 0
            fi
            echo "Esperando a que el backend inicialice ($i/30)..."
            sleep 1
          done
          echo "❌ El servidor no respondió a tiempo."
          exit 1

      - name: Run Postman E2E Flow with Newman
        run: |
          npx newman run postman/AI_Ticket_It_Flujo_E2E.postman_collection.json \
            -e postman/AI_Ticket_It_Local.postman_environment.json \
            --reporters cli,json \
            --reporter-json-export newman-report.json

      - name: Upload Newman Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postman-e2e-report
          path: newman-report.json
          retention-days: 14
